<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A1 Restaurant | Admin Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0e1117; --card: #1e2535; --text: #f0ebe2; --text2: #9aacba;
      --border: #2a3548; --orange: #e8640a; --navy: #08234a;
      --shadow-lg: 0 24px 64px rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text);
      min-height: 100vh; display: grid; place-items: center;
      background-image: radial-gradient(ellipse at 20% 50%, rgba(232,100,10,0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 20%, rgba(58,123,213,0.08) 0%, transparent 50%);
    }
    .login-card {
      width: min(420px, calc(100vw - 40px));
      background: var(--card); border: 1px solid var(--border);
      border-radius: 20px; padding: 48px 40px; box-shadow: var(--shadow-lg);
    }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo-icon {
      width: 64px; height: 64px; border-radius: 16px;
      background: var(--orange); display: grid; place-items: center;
      font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 900;
      color: #fff; margin: 0 auto 14px;
    }
    .login-logo h1 { font-family: 'Playfair Display', serif; font-size: 1.5rem; }
    .login-logo p { color: var(--text2); font-size: 0.88rem; margin-top: 4px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.85rem; color: var(--text2); font-weight: 600; margin-bottom: 8px; }
    .form-group input {
      width: 100%; background: rgba(255,255,255,0.05); border: 2px solid var(--border);
      border-radius: 12px; padding: 14px 16px; color: var(--text); font: inherit; font-size: 0.95rem;
      transition: border-color 0.25s;
    }
    .form-group input:focus { outline: none; border-color: var(--orange); }
    .login-btn {
      width: 100%; background: var(--orange); color: #fff; border: none;
      padding: 15px; border-radius: 12px; font: inherit; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: all 0.25s; margin-top: 8px;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .login-btn:hover { background: #c4500a; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(232,100,10,0.4); }
    .login-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
    .error-msg {
      background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.3);
      border-radius: 10px; padding: 12px; color: #f87171; font-size: 0.88rem;
      margin-top: 14px; display: none; text-align: center;
    }
    .back-link { text-align: center; margin-top: 24px; }
    .back-link a { color: var(--text2); font-size: 0.85rem; text-decoration: none; transition: color 0.2s; }
    .back-link a:hover { color: var(--orange); }
    .spinner { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: #fff; border-radius: 50%; animation: spin 0.6s linear infinite; display: none; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">A1</div>
      <h1>Admin Dashboard</h1>
      <p>Sign in to manage orders</p>
    </div>
    <form id="loginForm">
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username" placeholder="admin" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="login-btn" id="loginBtn">
        <div class="spinner" id="spinner"></div>
        <span id="btnText">Sign In</span>
      </button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
    <div class="back-link"><a href="/">← Back to Restaurant</a></div>
  </div>

  <script>
    // Redirect if already logged in
    if (localStorage.getItem('a1_admin_token')) {
      window.location.href = '/admin/dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');
      const errorMsg = document.getElementById('errorMsg');
      btn.disabled = true; spinner.style.display = 'block'; btnText.textContent = 'Signing in...'; errorMsg.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('a1_admin_token', data.token);
          localStorage.setItem('a1_admin_user', data.admin.username);
          window.location.href = '/admin/dashboard.html';
        } else {
          errorMsg.textContent = data.message;
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Could not connect to server. Is it running?';
        errorMsg.style.display = 'block';
      } finally {
        btn.disabled = false; spinner.style.display = 'none'; btnText.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
